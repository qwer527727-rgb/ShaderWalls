plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shaderwalls.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shaderwalls.app'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key so the APK installs directly
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
